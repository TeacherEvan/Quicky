org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Bypass AGP 9 built-in-Kotlin enforcement so the pre-AGP-9 plugins
# (camera_android_camerax 0.7.4+5, image_picker_android) can still apply the
# external KGP plugin. Temporary until those plugins ship AGP-9-compatible builds.
android.newDsl=false
android.builtInKotlin=false
