<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eight handy Thailand-travel tools — cost converter, location, bathrooms, attractions, day counter, Bolt, banking and weather — in one installable app.">
  <meta name="color-scheme" content="dark light">

  <!-- Pre-paint background matching AppTheme surfaces: kills the white
       flash between HTML parse and the first Flutter frame. -->
  <style>
    html { background: #14111F; }
    @media (prefers-color-scheme: light) { html { background: #F7F5FF; } }
  </style>

  <!-- PWA / brand -->
  <meta name="theme-color" content="#14111F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quicky">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quicky — Thailand Travel Hub</title>
  <link rel="manifest" href="manifest.json">

  <!-- Capture the browser install offer early so the Settings "Install
       Quicky" row can consume it later (lib/shared/pwa/pwa_bridge_web.dart). -->
  <script>
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__quickyInstallPrompt = event;
    });
  </script>
  <script>
    // Offline shell: Flutter 3.44's loader no longer registers its generated
    // service worker on first visit, so Quicky ships and registers its own.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
