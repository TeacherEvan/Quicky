<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B3DF5" />
    <title>Offline — Quicky</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-elev: #f7f5ff;
        --text: #14111f;
        --text-muted: #5a5469;
        --border: #e0dceb;
        --brand: #5b3df5;
        --brand-on: #ffffff;
        --radius: 14px;
        --radius-sm: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14111f;
          --bg-elev: #1d1933;
          --text: #f1ecff;
          --text-muted: #a59bc7;
          --border: #2a2440;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(20, 17, 31, 0.06);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: var(--text-muted);
        margin: 0 0 20px;
        font-size: 14px;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: var(--brand);
        color: var(--brand-on);
        border: 1px solid var(--brand);
        border-radius: var(--radius-sm);
        padding: 10px 18px;
        font-weight: 500;
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Quicky needs a connection to fetch live data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
