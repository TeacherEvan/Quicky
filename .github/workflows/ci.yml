name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        # very_good_analysis emits 190+ info-level lints (doc-comment nits);
        # they are shown locally but not treated as fatal so CI gates on real
        # errors/warnings only. Run `dart analyze --fatal-infos` locally to see them.
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test --coverage

      - name: Build release APK
        run: flutter build apk --release
