name: ci
on:
  push:
    branches: [master, main, feat/**]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_SITE_URL: https://glad-mongoose-104.convex.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke (live Convex weather probe)
        run: |
          body=$(curl -sS -m 20 "$NEXT_PUBLIC_CONVEX_SITE_URL/api/weather?lat=13.7563&lng=100.5018&units=C" || true)
          echo "weather: $body"
          echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(typeof j.tempC!=='number'){process.exit(1)}})"
